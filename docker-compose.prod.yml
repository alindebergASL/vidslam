# Production-mode overlay for docker-compose. Applies on top of
# docker-compose.yml so dev defaults remain the obvious path.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What changes vs. dev:
#   - Frontend is built (Next.js production bundle) and runs `next start` —
#     no HMR, no source volume mount, no `.next` tmpfs.
#   - Backend drops --reload and binds workers=2 so a stuck request can't pin
#     the only worker.
#   - The :8000 / :3000 ports are not published; only nginx (or whatever you
#     put in front) talks to them, so the prod stack is intended to sit
#     behind nginx/avatarvideostudio.conf on a single EC2 host.
#   - No bind-mount of code into the containers — the image *is* the artifact.
#
# Env required at runtime (set in .env or the host environment):
#   POSTGRES_PASSWORD       — required: Postgres password (URL-safe, e.g.
#                             `openssl rand -hex 24`)
#   MVP_PASSWORD            — the shared password
#   SESSION_SECRET          — at least 32 random chars; rotate => log everyone out
#   PUBLIC_BASE_URL         — public origin nginx serves (e.g. https://avs.example.com)
#   FRONTEND_ORIGIN         — same value; used for CORS
#   NEXT_PUBLIC_API_BASE    — what the *browser* hits (e.g. https://avs.example.com)
#   OPENROUTER_API_KEY      — optional; mocks otherwise
#   ELEVENLABS_API_KEY      — optional; mocks otherwise
#   S3_BUCKET               — strongly recommended: hour-long renders are
#                             50–500 MB each; downloads redirect to S3
#   RENDER_RETENTION_KEEP   — e.g. 3: keep the newest N renders per project
#   ALERT_WEBHOOK_URL       — Slack/Discord webhook for failures
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET — optional, for publishing
#
# QUEUE_MODE=required (set below) makes the API return 503 instead of running
# an hour-long job inside a web worker if Redis is down; /readyz also goes
# not-ready until Redis answers and a worker is registered.

services:
  # Production database. SQLite (the dev default) is shared by several
  # processes here — web workers, the RQ worker, the catalog poller — and
  # serializes every write; Postgres doesn't. Migrations run at backend boot
  # (advisory-locked). See docs/postgres.md.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: avs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avs -d avs"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    volumes:
      - ./data:/data
    ports: !reset []
    expose:
      - "8000"
    environment:
      QUEUE_MODE: required
      DATABASE_URL: postgresql+psycopg://avs:${POSTGRES_PASSWORD}@postgres:5432/avs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  worker:
    build:
      context: ./backend
    volumes:
      - ./data:/data
    environment:
      QUEUE_MODE: required
      DATABASE_URL: postgresql+psycopg://avs:${POSTGRES_PASSWORD}@postgres:5432/avs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Inline the public API base at build time so the browser's fetch
        # targets the externally-reachable origin, not the in-cluster name.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    volumes: !reset []
    ports: !reset []
    expose:
      - "3000"
    command: npm run start

volumes:
  pgdata:
