name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (with dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app

      - name: Tests (mock providers)
        env:
          MOCK_PROVIDERS: "true"
        run: pytest -q

      - name: End-to-end smoke
        env:
          MOCK_PROVIDERS: "true"
        run: python -m scripts.smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check + build
        run: npm run build
