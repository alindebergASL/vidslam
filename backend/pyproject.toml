[project]
name = "avatarvideostudio-backend"
version = "0.1.0"
description = "AvatarVideoStudio backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "Pillow>=10.4",
  "rq>=1.16",
  "redis>=5.0",
  "itsdangerous>=2.2",
  "python-slugify>=8.0",
  "alembic>=1.13",
]

# The alembic `migrations/` directory sits next to `app/` and would trip
# setuptools' flat-layout auto-discovery ("multiple top-level packages").
# Only `app` is the installable package; migrations ride along as files.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]
# Only required when S3-backed asset delivery is enabled. Install via
# `pip install -e ".[s3]"` on production deploys that configure s3_bucket;
# the local-fs path doesn't import boto3 and works without it.
s3 = [
  "boto3>=1.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Errors, pyflakes, imports, warnings, bugbear. pyupgrade (UP) is intentionally
# omitted — the codebase uses explicit typing.Optional/List style on purpose.
select = ["E", "F", "I", "W", "B"]
# E501: long lines handled by formatter. B008: FastAPI relies on Depends()/File()
# as default-argument calls, which is the intended pattern.
ignore = ["E501", "B008"]
