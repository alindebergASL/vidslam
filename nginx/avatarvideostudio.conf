# Sample Nginx config for an EC2 deployment.
# Drop into /etc/nginx/sites-available/avatarvideostudio and `nginx -s reload`,
# then `certbot --nginx -d your-domain.example.com`.

server {
    listen 80;
    server_name your-domain.example.com;

    # Allow large uploads: backend max_upload_bytes (50 MB) plus multipart overhead.
    client_max_body_size 55m;

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Liveness / readiness probes live at the backend root, not under /api/.
    location ~ ^/(health|healthz|readyz)$ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Tokenized public asset URLs (used by video providers to fetch references).
    location /api/public-assets/ {
        proxy_pass http://127.0.0.1:8000/api/public-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cache aggressively at the edge; tokens are unique per asset.
        add_header Cache-Control "public, max-age=86400";
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
